<!DOCTYPE html>
<html>
<head><title>Billing Engine</title><style>body{font-family:sans-serif;padding:2rem;background:#090d16;color:#fff;max-width:850px;margin:auto;}input{width:100%;margin-bottom:8px;padding:8px;background:#1e293b;border:1px solid #334155;color:#fff;}button{background:#0284c7;color:#fff;padding:8px 16px;border:none;cursor:pointer;}table{width:100%;border-collapse:collapse;margin-top:1.5rem;}th,td{padding:8px;border:1px solid #334155;}a{color:#38bdf8;text-decoration:none;}</style></head>
<body>
  <h1>Invoice & Billing Center</h1>
  <form method="POST">
    {% csrf_token %}
    <input name="client_name" placeholder="Client / Company Name" required>
    <input name="client_email" type="email" placeholder="Billing Email" required>
    <input name="tax_percent" type="number" step="0.1" value="5.0" placeholder="Tax Percentage (%)">
    <button type="submit">Create New Invoice</button>
  </form>

  <h2>Recent Invoices</h2>
  <table>
    <tr><th>Invoice #</th><th>Client</th><th>Date</th><th>Total Due</th><th>View</th></tr>
    {% for inv in invoices %}
      <tr>
        <td><b>{{ inv.invoice_number }}</b></td>
        <td>{{ inv.client_name }}</td>
        <td>{{ inv.created_at|date:"M d, Y" }}</td>
        <td>${{ inv.total_due }}</td>
        <td><a href="/invoice/{{ inv.id }}/">Open & Add Items &rarr;</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="5">No invoices generated.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
